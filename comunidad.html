<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidad | Nicolas Lobos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #080808; color: #e5e5e5; }
        .text-earth { color: #8C7851; }
        .bg-earth { background-color: #8C7851; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-blur: 10px; border: 1px solid rgba(255, 255, 255, 0.05); }
        video { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; filter: grayscale(100%); transition: 0.5s; }
        .video-card:hover video { filter: grayscale(0%); }
    </style>
</head>
<body class="overflow-x-hidden">

    <header class="fixed top-0 w-full z-[100] bg-black/95 border-b border-white/5">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="index.html" class="text-xl font-black tracking-tighter uppercase italic">
                NICOLAS<span class="text-earth">LOBOS</span>
            </a>
            <a href="index.html" class="text-[9px] font-black uppercase tracking-widest text-earth flex items-center gap-2 italic hover:text-white transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al Inicio
            </a>
        </div>
    </header>

    <main class="pt-40 pb-24 px-6 text-center">
        <div class="max-w-6xl mx-auto space-y-32">
            
            <div class="space-y-6">
                <h1 class="text-6xl font-black uppercase italic tracking-tighter">Cultura <span class="text-earth">⚫️🟡</span></h1>
                <p class="text-zinc-500 uppercase text-[10px] tracking-[0.5em] font-bold">La energía del Team en movimiento.</p>
            </div>

            <div class="grid md:grid-cols-2 gap-16">
                <div class="space-y-8">
                    <div class="aspect-[9/16] bg-zinc-900 rounded-sm overflow-hidden video-card shadow-2xl max-w-xs mx-auto border border-white/5">
                        <video poster="image_e2704d.png" controls preload="metadata">
                            <source src="Video_2.mp4" type="video/mp4">
                        </video>
                    </div>
                    <h3 class="text-xl font-black uppercase tracking-widest text-earth italic">El Equipo</h3>
                </div>

                <div class="space-y-8">
                    <div class="aspect-[9/16] bg-zinc-900 rounded-sm overflow-hidden video-card shadow-2xl max-w-xs mx-auto border border-white/5">
                        <video poster="image_e26fb9.png" controls preload="metadata">
                            <source src="Video_3.mp4" type="video/mp4">
                        </video>
                    </div>
                    <h3 class="text-xl font-black uppercase tracking-widest italic text-white">Girl Power</h3>
                </div>
            </div>

            <section class="glass p-10 rounded-sm space-y-10 border-earth/20 max-w-3xl mx-auto">
                <div class="space-y-4">
                    <h2 class="text-3xl font-black uppercase italic tracking-tighter">Potencia tu Mentalidad <br><span class="text-earth text-2xl">Asistente IA ✨</span></h2>
                    <p class="text-zinc-500 text-xs uppercase tracking-widest font-bold">Obtén un mantra de poder personalizado para entrenar</p>
                </div>
                
                <div class="space-y-6">
                    <input type="text" id="ai-input" placeholder="¿Cómo te sientes hoy antes de entrenar?" 
                           class="w-full bg-white/5 border border-white/10 p-5 rounded-sm outline-none focus:border-earth transition-all text-white">
                    <button onclick="getMantra()" id="ai-btn" class="bg-earth text-white px-10 py-5 rounded-sm font-black uppercase text-[10px] tracking-[0.4em] hover:brightness-110 transition-all w-full italic">
                        Generar Mantra ✨
                    </button>
                    <div id="ai-result" class="hidden p-6 bg-earth/10 border border-earth/20 rounded-sm italic text-zinc-300 text-sm leading-relaxed"></div>
                </div>
            </section>

        </div>
    </main>

    <footer class="py-12 bg-black px-6 text-center border-t border-white/5 mt-24">
        <p class="text-[9px] text-zinc-800 uppercase tracking-[0.8em]">© 2026 Nicolas Lobos.</p>
    </footer>

    <script>
        lucide.createIcons();
        
        // Configuración de la API de Gemini
        const apiKey = ""; // IMPORTANTE: Aquí deberás colocar tu API Key de Google Gemini más adelante para que funcione

        async function getMantra() {
            const input = document.getElementById('ai-input').value;
            const btn = document.getElementById('ai-btn');
            const resultDiv = document.getElementById('ai-result');
            
            if(!input) return;

            btn.disabled = true;
            btn.innerHTML = "Consultando a la IA... ✨";
            resultDiv.classList.add('hidden');

            const systemPrompt = "Eres Nicolas Lobos, coach de alto rendimiento. Estilo rudo pero motivador. Frase clave: 'Sin atajos'. Genera un mantra de máximo 20 palabras basado en lo que siente el usuario.";
            
            try {
                if(apiKey === "") {
                    resultDiv.innerHTML = "⚠️ La función de IA requiere configurar la clave de API (API Key) en el código. Pero estás un paso más cerca de tu objetivo. ¡Sin atajos!";
                    resultDiv.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerHTML = "Generar Mantra ✨";
                    return;
                }

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Usuario siente: ${input}` }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });
                const data = await response.json();
                resultDiv.innerHTML = data.candidates[0].content.parts[0].text;
                resultDiv.classList.remove('hidden');
            } catch (e) {
                resultDiv.innerHTML = "Intenta de nuevo más tarde.";
                resultDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = "Generar Mantra ✨";
            }
        }
    </script>
</body>
</html>
